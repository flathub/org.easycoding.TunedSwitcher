id: org.easycoding.TunedSwitcher
sdk: org.kde.Sdk
runtime: org.kde.Platform
runtime-version: 6.9
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --system-talk-name=com.redhat.tuned
  - --system-talk-name=org.freedesktop.systemd1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
command: tuned-switcher
modules:
  - name: tuned-switcher
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/xvitaly/tuned-switcher.git
        tag: v0.9.0
        commit: b47c8eb95bd5355103afdcc1c841a4fa2967b3c1
        x-checker-data:
          type: json
          url: https://api.github.com/repos/xvitaly/tuned-switcher/releases/latest
          tag-query: .tag_name
          version-query: $tag | sub("^v"; "")
          timestamp-query: .published_at
